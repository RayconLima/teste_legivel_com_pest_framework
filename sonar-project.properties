# ==========================================
# Informações do Projeto
# ==========================================
sonar.projectKey=bug-tracker-laravel
sonar.projectName=Bug Tracker - Laravel
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ==========================================
# Estrutura Laravel
# ==========================================
# Código fonte da aplicação (apenas app/)
sonar.sources=app

# Diretório de testes
sonar.tests=tests

# ==========================================
# Exclusões - Arquivos Laravel
# ==========================================
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/storage/**,\
    **/bootstrap/cache/**,\
    **/public/**,\
    **/database/migrations/**,\
    **/database/seeders/**,\
    **/database/factories/**,\
    **/config/**,\
    **/resources/views/**,\
    **/resources/lang/**,\
    **/*.blade.php,\
    **/routes/**

# ==========================================
# Exclusões de Cobertura
# ==========================================
sonar.coverage.exclusions=\
    **/tests/**,\
    **/database/**,\
    **/config/**,\
    **/bootstrap/**,\
    **/resources/**,\
    **/routes/**,\
    **/app/Providers/**,\
    **/app/Http/Middleware/**,\
    **/app/Console/Kernel.php,\
    **/app/Exceptions/Handler.php

# ==========================================
# Duplicação de Código
# ==========================================
sonar.cpd.exclusions=\
    **/database/migrations/**,\
    **/database/factories/**,\
    **/config/**

# ==========================================
# PHP Específico
# ==========================================
sonar.language=php

# Caminho do relatório de cobertura (gerado pelo PCOV)
sonar.php.coverage.reportPaths=coverage.xml

# Versão do PHP
sonar.php.version=8.2

# ==========================================
# Quality Gate
# ==========================================
# Aguarda resultado do Quality Gate
sonar.qualitygate.wait=true

# Timeout para aguardar o Quality Gate (em segundos)
sonar.qualitygate.timeout=300

# ==========================================
# Análise de Código
# ==========================================
# Detectar duplicação de código (mínimo de tokens para considerar duplicação)
sonar.cpd.php.minimumTokens=50

# Complexidade ciclomática máxima recomendada por função
sonar.php.complexity.threshold=10